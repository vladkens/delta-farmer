name: ci

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - run: make check

  release:
    if: ${{ github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:') }}
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release commit matches pyproject.toml version
        id: release
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          TITLE="${COMMIT_MESSAGE%%$'\n'*}"
          TAG="v$(grep '^version = ' pyproject.toml | cut -d'"' -f2)"
          if [ "$TITLE" != "release: $TAG" ]; then
            echo "Error: expected commit title 'release: $TAG', got '$TITLE'"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Extract changelog entry
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          awk -v tag="$TAG" '/^## / { found = ($2 == tag); next } found && $0 != "---"' changelog.md > release_notes.txt
          if ! grep -q '^- [^[:space:]]' release_notes.txt; then
            echo "Error: no changes listed in changelog for $TAG"
            exit 1
          fi

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            if [ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$GITHUB_SHA" ]; then
              echo "Error: tag $TAG already points to another commit"
              exit 1
            fi
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file release_notes.txt
          fi
